<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leon Bookmarks</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 3l1.5 4.5H18l-3.5 2.5 1.5 4.5L12 12l-4 2.5 1.5-4.5L6 7.5h4.5z"/>
        </svg>
        <span class="logo-text">Leon Bookmarks</span>
      </div>
      <button id="logoutBtn" class="icon-btn" title="Logout" style="display:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </header>

    <!-- Login View -->
    <div id="loginView" class="view">
      <div class="view-title">Sign in to save bookmarks</div>
      <form id="loginForm">
        <div class="field">
          <label>Email</label>
          <input type="email" id="loginEmail" placeholder="you@example.com" required>
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="loginPassword" placeholder="••••••••" required>
        </div>
        <div class="field">
          <label>API URL</label>
          <input type="url" id="apiUrl" value="http://localhost:4000/api" placeholder="https://api.bookmarks.dev">
        </div>
        <div id="loginError" class="error" style="display:none;"></div>
        <button type="submit" id="loginBtn" class="btn btn-primary">Sign In</button>
      </form>
    </div>

    <!-- Save Bookmark View -->
    <div id="saveView" class="view" style="display:none;">
      <div class="user-info">
        <span id="userName"></span>
        <span id="tenantName" class="badge"></span>
      </div>
      <form id="saveForm">
        <div class="field">
          <label>Title</label>
          <input type="text" id="bookmarkTitle" required>
        </div>
        <div class="field">
          <label>URL</label>
          <input type="url" id="bookmarkUrl" required>
        </div>
        <div class="field">
          <label>Description</label>
          <textarea id="bookmarkDesc" rows="2" placeholder="Optional description..."></textarea>
        </div>
        <div class="field">
          <label>Category</label>
          <select id="bookmarkCategory">
            <option value="">No category</option>
          </select>
        </div>
        <div class="field">
          <label>Tags</label>
          <input type="text" id="bookmarkTags" placeholder="tag1, tag2, tag3">
        </div>
        <div id="saveError" class="error" style="display:none;"></div>
        <div id="saveSuccess" class="success" style="display:none;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
          Bookmark saved!
        </div>
        <button type="submit" id="saveBtn" class="btn btn-primary">Save Bookmark</button>
      </form>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
